<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeaStream - مشغل الأنمي</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .box { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 600px; width: 100%; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h3 { margin-top: 0; text-align: center; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #2563eb; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .card { background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #334155; }
    video { width: 100%; margin-top: 15px; border-radius: 8px; background: #000; outline: none; }
    .status { color: #f59e0b; margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="box">
    <h3>SeaStream - استخراج وتشغيل الحلقات</h3>
    <input type="text" id="videoUrl" placeholder="ضع رابط Streamtape هنا (مثال: stape.me/e/...)">
    <button onclick="extractAndPlay()">استخراج وتشغيل</button>

    <div id="status" class="status" style="display:none;">جاري تخطي الحماية واستخراج الرابط...</div>
    <div id="result"></div>
  </div>

  <script>
    async function extractAndPlay() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');

      if (!urlInput) {
        alert('يرجى وضع رابط الحلقة أولاً');
        return;
      }

      statusDiv.style.display = 'block';
      resultDiv.innerHTML = '';

      // رابط خدمة Railway الخاصة بك التي أنشأناها
      const railwayApiUrl = 'https://seso-production.up.railway.app/extract?url=' + encodeURIComponent(urlInput);

      try {
        const res = await fetch(railwayApiUrl);
        const data = await res.json();
        
        statusDiv.style.display = 'none';

        if (data.success) {
          // تمرير رابط الـ API مباشرة داخل وسم الفيديو لتشغيله عبر سيرفر البث
          resultDiv.innerHTML = `
            <div class="card">
              <p style="color: #38bdf8; font-weight: bold; margin-bottom: 5px;">تم الاستخراج بنجاح:</p>
              <video controls autoplay>
                <source src="${data.directLink}" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو
              </video>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<div class="card" style="color:#f87171;">خطأ: ${data.error}</div>`;
        }
      } catch (err) {
        statusDiv.style.display = 'none';
        resultDiv.innerHTML = `<div class="card" style="color:#f87171;">فشل الاتصال بخادم الاستخراج</div>`;
      }
    }
  </script>

</body>
</html>
