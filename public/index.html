<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مستخرج Streamtape</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px; 
    }
    .box { 
      background: #1e293b; 
      padding: 25px; 
      border-radius: 12px; 
      max-width: 500px; 
      width: 100%; 
      border: 1px solid #334155; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h3 { margin-top: 0; text-align: center; color: #38bdf8; }
    label { font-size: 0.9rem; color: #cbd5e1; display: block; margin-bottom: 8px; }
    input { 
      width: 100%; 
      padding: 12px; 
      margin-bottom: 15px; 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      color: #fff; 
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #2563eb; 
      border: none; 
      color: white; 
      border-radius: 8px; 
      font-size: 1rem;
      font-weight: bold; 
      cursor: pointer; 
    }
    button:hover { background: #1d4ed8; }
    .card { 
      background: #0f172a; 
      padding: 15px; 
      border-radius: 8px; 
      margin-top: 20px; 
      border: 1px solid #334155; 
      word-break: break-all; 
    }
    video { width: 100%; margin-top: 15px; border-radius: 8px; background: #000; }
    .status { color: #f59e0b; margin-top: 15px; text-align: center; font-weight: bold; }
    .error-tag {
      background: #ef444422;
      color: #f87171;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      display: inline-block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3>جلب آخر حلقة وتفكيك الرابط</h3>
    <label for="folderName">اسم المجلد داخل Streamtape:</label>
    <input type="text" id="folderName" placeholder="اكتب اسم المجلد هنا...">
    <button onclick="fetchEpisode()">بحث واستخراج</button>

    <div id="status" class="status" style="display:none;">جاري الاتصال والبحث...</div>
    <div id="result"></div>
  </div>

  <script>
    async function fetchEpisode() {
      const folderInput = document.getElementById('folderName');
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');

      const folderName = folderInput.value.trim();

      if (!folderName) {
        alert('يرجى كتابة اسم المجلد أولاً');
        return;
      }

      statusDiv.style.display = 'block';
      resultDiv.innerHTML = '';

      try {
        const response = await fetch('/api/get-latest?folderName=' + encodeURIComponent(folderName));
        const data = await response.json();
        
        statusDiv.style.display = 'none';

        if (data.success) {
          resultDiv.innerHTML = 
            '<div class="card">' +
              '<p><strong>الملف:</strong> ' + data.fileName + '</p>' +
              '<p><strong>الرابط المباشر:</strong></p>' +
              '<a href="' + data.directLink + '" target="_blank" style="color:#38bdf8">' + data.directLink + '</a>' +
              '<video controls autoplay><source src="' + data.directLink + '" type="video/mp4"></video>' +
            '</div>';
        } else {
          resultDiv.innerHTML = 
            '<div class="card" style="border-color: #ef4444;">' +
              '<div class="error-tag">' + (data.errorCode || 'ERR_UNKNOWN') + '</div>' +
              '<p style="color: #f87171; margin: 5px 0;"><strong>الرسالة:</strong> ' + data.error + '</p>' +
              (data.details ? '<p style="color: #94a3b8; font-size: 0.85rem;"><strong>التفاصيل:</strong> ' + data.details + '</p>' : '') +
            '</div>';
        }
      } catch (err) {
        statusDiv.style.display = 'none';
        resultDiv.innerHTML = 
          '<div class="card" style="border-color: #ef4444;">' +
            '<div class="error-tag">ERR_JS_CLIENT</div>' +
            '<p style="color: #f87171;">فشل الاتصال بالخادم الداخلي أو يوجد خلل في الشبكة.</p>' +
          '</div>';
      }
    }
  </script>

</body>
</html>
